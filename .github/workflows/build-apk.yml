name: Build & Deploy APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
  workflow_dispatch:   # permite rodar manualmente pelo GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Get version info
        id: ver
        run: |
          VER=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"\K[^"]+')
          CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | grep -oP '\d+')
          SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "code=$CODE"   >> $GITHUB_OUTPUT
          echo "size=$SIZE"   >> $GITHUB_OUTPUT

      - name: Copy APK to static downloads
        run: |
          mkdir -p server/src/main/resources/static/downloads
          cp app/build/outputs/apk/debug/app-debug.apk \
             server/src/main/resources/static/downloads/protect.apk
          echo "✅ APK debug v${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.code }}) copiado — ${{ steps.ver.outputs.size }}"

      - name: Commit APK to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/src/main/resources/static/downloads/protect.apk
          git diff --staged --quiet && echo "APK sem alterações, nada a commitar." || \
            git commit -m "chore(apk): atualiza protect.apk v${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.code }}) [skip ci]"
          git push
