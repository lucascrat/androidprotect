name: Build & Deploy APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
  workflow_dispatch:   # permite rodar manualmente pelo GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APKs (protect + calc + samsung flavors)
        run: ./gradlew assembleProtectDebug assembleCalcDebug assembleSamsungDebug --no-daemon

      - name: Get version info
        id: ver
        run: |
          VER=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"\K[^"]+')
          CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | grep -oP '\d+')
          SIZE_P=$(du -h app/build/outputs/apk/protect/debug/app-protect-debug.apk | cut -f1)
          SIZE_C=$(du -h app/build/outputs/apk/calc/debug/app-calc-debug.apk | cut -f1)
          SIZE_S=$(du -h app/build/outputs/apk/samsung/debug/app-samsung-debug.apk | cut -f1)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "code=$CODE"   >> $GITHUB_OUTPUT
          echo "size_p=$SIZE_P" >> $GITHUB_OUTPUT
          echo "size_c=$SIZE_C" >> $GITHUB_OUTPUT
          echo "size_s=$SIZE_S" >> $GITHUB_OUTPUT

      - name: Copy APKs to static downloads
        run: |
          mkdir -p server/src/main/resources/static/downloads
          cp app/build/outputs/apk/protect/debug/app-protect-debug.apk \
             server/src/main/resources/static/downloads/protect.apk
          cp app/build/outputs/apk/calc/debug/app-calc-debug.apk \
             server/src/main/resources/static/downloads/calc.apk
          cp app/build/outputs/apk/samsung/debug/app-samsung-debug.apk \
             server/src/main/resources/static/downloads/samsung.apk
          echo "✅ protect.apk v${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.code }}) — ${{ steps.ver.outputs.size_p }}"
          echo "✅ calc.apk v${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.code }}) — ${{ steps.ver.outputs.size_c }}"
          echo "✅ samsung.apk v${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.code }}) — ${{ steps.ver.outputs.size_s }}"

      - name: Commit APKs to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/src/main/resources/static/downloads/protect.apk \
                  server/src/main/resources/static/downloads/calc.apk \
                  server/src/main/resources/static/downloads/samsung.apk
          git diff --staged --quiet && echo "APKs sem alterações, nada a commitar." || \
            git commit -m "chore(apk): atualiza protect.apk, calc.apk e samsung.apk v${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.code }}) [skip ci]"
          git push

      - name: Deploy to Coolify
        run: |
          curl -s -f -X POST "https://appbr.pro/api/v1/applications/z11xrl23sl9vp8ly7rw7ua9u/start" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" && echo "✅ Deploy acionado" || echo "⚠️ Falha no deploy"
